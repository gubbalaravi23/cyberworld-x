<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Glass Badge Shield -->
  <rect x="10" y="15" width="130" height="130" rx="28" fill="#0b1329" stroke="url(#cyberGrad)" stroke-width="2.5" opacity="0.85" filter="url(#dropGlow)" />
  
  <!-- Futuristic Shield Geometry -->
  <polygon points="75,32 115,50 115,95 75,122 35,95 35,50" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4 2" />
  
  <!-- Inner Neural Core Network Nodes -->
  <circle cx="75" cy="55" r="4.5" fill="#00f0ff" filter="url(#glassGlow)" />
  <circle cx="50" cy="85" r="4" fill="#7000ff" />
  <circle cx="100" cy="85" r="4" fill="#ff007f" />
  <circle cx="75" cy="100" r="5" fill="#00f0ff" filter="url(#glassGlow)" />

  <!-- Node Connection Vectors -->
  <line x1="75" y1="55" x2="50" y2="85" stroke="#00f0ff" stroke-width="1.8" opacity="0.8" />
  <line x1="75" y1="55" x2="100" y2="85" stroke="#ff007f" stroke-width="1.8" opacity="0.8" />
  <line x1="50" y1="85" x2="75" y2="100" stroke="#7000ff" stroke-width="1.8" opacity="0.8" />
  <line x1="100" y1="85" x2="75" y2="100" stroke="#00f0ff" stroke-width="1.8" opacity="0.8" />
  <line x1="50" y1="85" x2="100" y2="85" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" />

  <!-- Core Pulsar Symbol -->
  <circle cx="75" cy="82" r="7" fill="url(#cyberGrad)" />
  <circle cx="75" cy="82" r="2.5" fill="#ffffff" />

  <!-- Typography: CYBERWORLD-X -->
  <text x="165" y="76" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#ffffff">
    CYBER<tspan fill="#00f0ff">WORLD</tspan><tspan fill="#ff007f">-X</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="168" y="106" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#8ea2be">
    AI-BASED NETWORK ATTACK FORECASTING
  </text>

  <!-- NTRO SIH 2026 Micro Badge -->
  <rect x="168" y="118" width="138" height="20" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
  <text x="175" y="132" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#00f0ff">
    NTRO SIH PS: 26153
  </text>
  
  <rect x="314" y="118" width="145" height="20" rx="4" fill="rgba(112, 0, 255, 0.15)" stroke="rgba(112, 0, 255, 0.4)" stroke-width="1" />
  <text x="322" y="132" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#c084fc">
    TEMPORAL WORLD MODEL
  </text>
</svg>
